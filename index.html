<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#050505">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>The Anchor</title>
<style>
  :root {
    --bg-color: #050505;
    --text-color: #d1d1d1;
    --dim-color: #5a5a5a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    background-color: var(--bg-color);
    margin: 0; padding: 0; height: 100vh; width: 100vw;
    overflow: hidden; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }
  body {
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    cursor: pointer;
  }

  .mode-bar {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: center; align-items: center;
    gap: 18px;
    padding: 22px 16px 0 16px;
    opacity: 0.55;
    transition: opacity 0.3s ease;
  }
  .mode-bar:active { opacity: 0.9; }
  .mode-arrow {
    font-family: 'Georgia', serif;
    font-size: 20px;
    color: var(--text-color);
    padding: 6px 10px;
    line-height: 1;
  }
  .mode-label {
    font-family: 'Georgia', serif;
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--dim-color);
    min-width: 150px;
    text-align: center;
  }

  .text-container { width: 85%; max-width: 620px; text-align: center; }
  .statement {
    font-family: 'Georgia', serif; font-size: 22px; line-height: 1.65;
    color: var(--text-color); opacity: 0; transform: translateY(10px);
    transition: opacity 1.1s ease, transform 1.1s ease;
  }
  .statement.visible { opacity: 1; transform: translateY(0); }

  .hint {
    position: fixed; bottom: 26px; left: 0; right: 0;
    text-align: center;
    font-family: 'Georgia', serif;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--dim-color);
    opacity: 0.5;
  }
</style>
</head>
<body>
  <div class="mode-bar" id="modeBar">
    <div class="mode-arrow" id="prevArrow">&#8249;</div>
    <div class="mode-label" id="modeLabel">Anchor</div>
    <div class="mode-arrow" id="nextArrow">&#8250;</div>
  </div>

  <div class="text-container">
    <div class="statement" id="statementText">Tap anywhere.</div>
  </div>

  <div class="hint">tap for a new line &middot; swipe or use arrows to change mode</div>

<script>
  let data = {};
  const textElement = document.getElementById('statementText');
  const modeLabel = document.getElementById('modeLabel');
  const modeBar = document.getElementById('modeBar');
  let isAnimating = false;

  // "anchor" is a virtual mode: it auto-picks morning/afternoon/evening by clock.
  const MODES = [
    { key: 'anchor',         label: 'Anchor' },
    { key: 'mindset',        label: 'Mindset' },
    { key: 'meeting_casual', label: 'Meeting · Casual' },
    { key: 'meeting_formal', label: 'Meeting · Formal' },
    { key: 'jokes',          label: 'Joke' },
    { key: 'funny_stories',  label: 'Story' },
  ];
  let modeIndex = 0;

  fetch('data.json')
    .then(response => response.json())
    .then(json => {
      data = json;
      textElement.classList.add('visible');
    })
    .catch(() => {
      textElement.textContent = "System ready. Tap to begin.";
      textElement.classList.add('visible');
    });

  function getTimeBasedList() {
    const hour = new Date().getHours();
    if (hour >= 5 && hour < 13) return data.morning;
    if (hour >= 13 && hour < 18) return data.afternoon;
    return data.evening;
  }

  function getCurrentList() {
    const mode = MODES[modeIndex].key;
    if (mode === 'anchor') return getTimeBasedList();
    return data[mode];
  }

  function showNewStatement() {
    if (isAnimating) return;
    isAnimating = true;
    textElement.classList.remove('visible');

    setTimeout(() => {
      const list = getCurrentList();
      if (list && list.length > 0) {
        const idx = Math.floor(Math.random() * list.length);
        textElement.textContent = list[idx];
      } else {
        textElement.textContent = "...";
      }
      textElement.classList.add('visible');
      isAnimating = false;
    }, 900);
  }

  function setMode(newIndex) {
    modeIndex = ((newIndex % MODES.length) + MODES.length) % MODES.length;
    modeLabel.textContent = MODES[modeIndex].label;
    showNewStatement();
  }

  document.getElementById('prevArrow').addEventListener('click', (e) => {
    e.stopPropagation();
    setMode(modeIndex - 1);
  });
  document.getElementById('nextArrow').addEventListener('click', (e) => {
    e.stopPropagation();
    setMode(modeIndex + 1);
  });
  modeLabel.addEventListener('click', (e) => e.stopPropagation());

  // Tap anywhere else = new line in current mode.
  let lastSwipeTime = 0;
  document.body.addEventListener('click', (e) => {
    if (modeBar.contains(e.target)) return;
    if (Date.now() - lastSwipeTime < 400) return; // avoid double-trigger after a swipe
    showNewStatement();
  });

  // Swipe left/right to change mode.
  let touchStartX = null, touchStartY = null;
  document.body.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive: true });

  document.body.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].screenX - touchStartX;
    const dy = e.changedTouches[0].screenY - touchStartY;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      lastSwipeTime = Date.now();
      if (dx < 0) setMode(modeIndex + 1);
      else setMode(modeIndex - 1);
    }
    touchStartX = null; touchStartY = null;
  }, { passive: true });
</script>
</body>
</html>
